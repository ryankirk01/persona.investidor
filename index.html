<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BABEL — Perfis de Investidores</title><style>html,body{margin:0;background:#06080a;color:#f5f6f2;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot b{color:#efd176}.boot small{display:block;margin-top:10px;color:#8b98a1}</style></head><body><div class="boot"><div><b>BABEL</b><br>Carregando análise de investidores…<small>Perfis, capital, influência e pontos de ouro</small></div></div><script>(async()=>{try{const files=['payload1.txt','payload2.txt','payload3.txt','payload4.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b=parts.join('').trim();const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();const html=new TextDecoder().decode(ab);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><b>BABEL</b><br>Não foi possível carregar a análise.<small>'+String(e)+'</small></div></div>'}})()</script></body></html>
